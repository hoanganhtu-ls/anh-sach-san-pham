<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh sách sản phẩm</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 30px;
        background-color: #f8f9fa;
      }

      h1 {
        color: #333;
        text-align: center;
      }

      table {
        width: 80%;
        margin: 20px auto;
        border-collapse: collapse;
        background-color: #ffffff;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      th,
      td {
        border: 1px solid #dddddd;
        padding: 12px 15px;
        text-align: center;
      }

      th {
        background-color: #007bff;
        color: white;
      }

      tr:nth-child(even) {
        background-color: #f2f2f2;
      }

      tr:hover {
        background-color: #e9ecef;
      }
    </style>
  </head>
  <body>
    <h1>Danh sách sản phẩm</h1>

    <table>
      <thead>
        <tr>
          <th>Tên sản phẩm</th>
          <th>Giá</th>
          <th>Số lượng</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Điện thoại iPhone 15 Pro</td>
          <td>28.990.000 VNĐ</td>
          <td>15</td>
        </tr>
        <tr>
          <td>Laptop MacBook Air M2</td>
          <td>24.500.000 VNĐ</td>
          <td>8</td>
        </tr>
        <tr>
          <td>Tai nghe AirPods Pro 2</td>
          <td>5.990.000 VNĐ</td>
          <td>25</td>
        </tr>
        <tr>
          <td>Đồng hồ Apple Watch Series 9</td>
          <td>10.490.000 VNĐ</td>
          <td>12</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
